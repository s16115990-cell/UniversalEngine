<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b10"
    >

    <title>UniversalEngine</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {

            --bg: #080b10;
            --panel: #111820;
            --panel2: #18212b;
            --border: #263442;

            --text: #f5f7fa;
            --muted: #9aa8b5;

            --green: #00ff88;
            --red: #ff4d5a;
            --yellow: #ffc857;
            --blue: #4da3ff;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);

            color: var(--text);

            padding: 20px;
        }

        .container {

            width: 100%;
            max-width: 900px;

            margin: 0 auto;
        }

        header {

            margin-bottom: 20px;
        }

        h1 {

            margin: 0;

            color: var(--green);

            font-size: 32px;
        }

        .subtitle {

            color: var(--muted);

            margin-top: 8px;

            font-size: 15px;
        }

        .panel {

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 16px;

            padding: 18px;

            margin-top: 15px;
        }

        .panel-title {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        .buttons {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;
        }

        button {

            appearance: none;

            border: 1px solid var(--border);

            background: var(--panel2);

            color: var(--text);

            padding: 12px 16px;

            border-radius: 10px;

            font-size: 14px;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        button:hover {

            background: #22303d;
        }

        button:active {

            transform: scale(0.97);
        }

        .primary {

            background: var(--green);

            color: #00150b;

            border-color: var(--green);

            font-weight: bold;
        }

        .danger {

            background: #32171b;

            border-color: #6d2930;
        }

        .status {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(130px, 1fr)
                );

            gap: 10px;
        }

        .stat {

            background: var(--panel2);

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 14px;
        }

        .stat-label {

            color: var(--muted);

            font-size: 12px;

            margin-bottom: 6px;
        }

        .stat-value {

            font-size: 18px;

            font-weight: bold;
        }

        .online {

            color: var(--green);
        }

        .offline {

            color: var(--red);
        }

        #output {

            background: #000;

            border: 1px solid var(--border);

            border-radius: 12px;

            padding: 15px;

            min-height: 150px;

            overflow-x: auto;

            white-space: pre-wrap;

            word-break: break-word;

            font-family:
                monospace;

            font-size: 13px;

            line-height: 1.5;
        }

        .log {

            margin-top: 10px;

            padding: 10px 12px;

            border-radius: 8px;

            background: #0d1319;

            color: var(--muted);

            font-family: monospace;

            font-size: 12px;
        }

        footer {

            text-align: center;

            color: var(--muted);

            font-size: 12px;

            padding: 25px 0;
        }

        @media (max-width: 600px) {

            body {
                padding: 14px;
            }

            h1 {
                font-size: 27px;
            }

            button {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <header>

        <h1>UniversalEngine</h1>

        <div class="subtitle">
            Personal Universal App Development Engine
        </div>

    </header>


    <!-- ENGINE CONTROLS -->

    <section class="panel">

        <div class="panel-title">
            Engine Controls
        </div>

        <div class="buttons">

            <button
                onclick="checkEngine()"
            >
                Check Engine
            </button>

            <button
                class="primary"
                onclick="startEngine()"
            >
                Start Engine
            </button>

            <button
                class="danger"
                onclick="stopEngine()"
            >
                Stop Engine
            </button>

            <button
                onclick="resetEngine()"
            >
                Reset
            </button>

        </div>

    </section>


    <!-- ENTITY CONTROLS -->

    <section class="panel">

        <div class="panel-title">
            Entity System
        </div>

        <div class="buttons">

            <button
                onclick="addTestEntity()"
            >
                Add Test Entity
            </button>

            <button
                onclick="clearEntities()"
            >
                Clear Entities
            </button>

        </div>

    </section>


    <!-- STATUS -->

    <section class="panel">

        <div class="panel-title">
            Live Status
        </div>

        <div class="status">

            <div class="stat">

                <div class="stat-label">
                    ENGINE
                </div>

                <div
                    id="engineState"
                    class="stat-value offline"
                >
                    OFFLINE
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    VERSION
                </div>

                <div
                    id="version"
                    class="stat-value"
                >
                    -
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    ENTITIES
                </div>

                <div
                    id="entities"
                    class="stat-value"
                >
                    0
                </div>

            </div>


            <div class="stat">

                <div class="stat-label">
                    FRAMES
                </div>

                <div
                    id="frames"
                    class="stat-value"
                >
                    0
                </div>

            </div>

        </div>

    </section>


    <!-- OUTPUT -->

    <section class="panel">

        <div class="panel-title">
            Engine Output
        </div>

        <div id="output">
            Initializing...
        </div>

        <div
            id="log"
            class="log"
        >
            Waiting for engine...
        </div>

    </section>


    <footer>

        UniversalEngine v1.0.0

    </footer>

</div>


<!--
    IMPORTANT:
    Load files in this exact order.
-->

<script src="./core/EngineConfig.js"></script>

<script src="./core/EventBus.js"></script>

<script src="./core/MasterEngine.js"></script>

<script src="./core/index.js"></script>


<script>

"use strict";


const output =
    document.getElementById("output");

const log =
    document.getElementById("log");

const engineState =
    document.getElementById("engineState");

const version =
    document.getElementById("version");

const entities =
    document.getElementById("entities");

const frames =
    document.getElementById("frames");


/* --------------------------------
   OUTPUT
-------------------------------- */

function show(data) {

    if (typeof data === "string") {

        output.textContent = data;

        return;
    }

    output.textContent =
        JSON.stringify(
            data,
            null,
            2
        );
}


/* --------------------------------
   LOG
-------------------------------- */

function writeLog(message) {

    const time =
        new Date()
            .toLocaleTimeString();

    log.textContent =
        "[" +
        time +
        "] " +
        message;
}


/* --------------------------------
   GET API
-------------------------------- */

function getAPI() {

    if (
        !window.UniversalEngineAPI
    ) {

        throw new Error(
            "UniversalEngineAPI is not loaded"
        );
    }

    return window.UniversalEngineAPI;
}


/* --------------------------------
   UPDATE UI
-------------------------------- */

function updateStatus() {

    try {

        const api =
            getAPI();

        const status =
            api.getStatus();

        engineState.textContent =
            status.running
                ? "RUNNING"
                : "STOPPED";

        engineState.className =
            status.running
                ? "stat-value online"
                : "stat-value offline";

        version.textContent =
            status.version;

        entities.textContent =
            status.entities;

        frames.textContent =
            status.frameCount;

        return status;

    } catch (error) {

        engineState.textContent =
            "ERROR";

        engineState.className =
            "stat-value offline";

        return null;
    }
}


/* --------------------------------
   CHECK ENGINE
-------------------------------- */

function checkEngine() {

    try {

        const api =
            getAPI();

        const status =
            api.getStatus();

        show({

            success: true,

            message:
                "UniversalEngine is loaded.",

            api:
                "UniversalEngineAPI",

            status:
                status

        });

        writeLog(
            "Engine check successful."
        );

        updateStatus();

    } catch (error) {

        show(
            "❌ ENGINE ERROR\n\n" +
            error.name +
            ": " +
            error.message
        );

        writeLog(
            "Engine check failed."
        );
    }
}


/* --------------------------------
   START ENGINE
-------------------------------- */

function startEngine() {

    try {

        const api =
            getAPI();

        const result =
            api.start();

        const status =
            api.getStatus();

        show({

            action:
                "START",

            result:
                result,

            status:
                status

        });

        writeLog(
            result
                ? "Engine started."
                : "Engine was already running."
        );

        updateStatus();

    } catch (error) {

        show(
            "❌ START ERROR\n\n" +
            error.name +
            ": " +
            error.message
        );
    }
}


/* --------------------------------
   STOP ENGINE
-------------------------------- */

function stopEngine() {

    try {

        const api =
            getAPI();

        const result =
            api.stop();

        const status =
            api.getStatus();

        show({

            action:
                "STOP",

            result:
                result,

            status:
                status

        });

        writeLog(
            result
                ? "Engine stopped."
                : "Engine was already stopped."
        );

        updateStatus();

    } catch (error) {

        show(
            "❌ STOP ERROR\n\n" +
            error.name +
            ": " +
            error.message
        );
    }
}


/* --------------------------------
   RESET
-------------------------------- */

function resetEngine() {

    try {

        const api =
            getAPI();

        const result =
            api.reset();

        show({

            action:
                "RESET",

            result:
                result,

            status:
                api.getStatus()

        });

        writeLog(
            "Engine reset completed."
        );

        updateStatus();

    } catch (error) {

        show(
            "❌ RESET ERROR\n\n" +
            error.name +
            ": " +
            error.message
        );
    }
}


/* --------------------------------
   ADD TEST ENTITY
-------------------------------- */

function addTestEntity() {

    try {

        const api =
            getAPI();

        const entity = {

            name:
                "TestEntity",

            enabled:
                true,

            updates:
                0,

            update(deltaTime) {

                this.updates++;

            }

        };

        const result =
            api.addEntity(
                entity
            );

        show({

            action:
                "ADD ENTITY",

            entity:
                {
                    name:
                        result.name,

                    enabled:
                        result.enabled
                },

            status:
                api.getStatus()

        });

        writeLog(
            "TestEntity added."
        );

        updateStatus();

    } catch (error) {

        show(
            "❌ ENTITY ERROR\n\n" +
            error.name +
            ": " +
            error.message
        );
    }
}


/* --------------------------------
   CLEAR ENTITIES
-------------------------------- */

function clearEntities() {

    try {

        const api =
            getAPI();

        const result =
            api.clearEntities();

        show({

            action:
                "CLEAR ENTITIES",

            result:
                result,

            status:
                api.getStatus()

        });

        writeLog(
            "All entities cleared."
        );

        updateStatus();

    } catch (error) {

        show(
            "❌ ENTITY ERROR\n\n" +
            error.name +
            ": " +
            error.message
        );
    }
}


/* --------------------------------
   ENGINE EVENTS
-------------------------------- */

window.addEventListener(
    "load",
    function () {

        try {

            if (
                !window.UniversalEngine
            ) {

                throw new Error(
                    "UniversalEngine failed to load."
                );
            }

            if (
                !window.UniversalEngineAPI
            ) {

                throw new Error(
                    "UniversalEngineAPI failed to load."
                );
            }

            updateStatus();

            show({
                success:
                    true,

                message:
                    "UniversalEngine ready.",

                status:
                    window
                        .UniversalEngineAPI
                        .getStatus()
            });

            writeLog(
                "UniversalEngine ready."
            );

        } catch (error) {

            show(
                "❌ LOAD ERROR\n\n" +
                error.name +
                ": " +
                error.message
            );

            writeLog(
                "Engine failed to initialize."
            );
        }

    }
);


/* --------------------------------
   LIVE STATUS
-------------------------------- */

setInterval(
    function () {

        updateStatus();

    },
    500
);


/* --------------------------------
   ENGINE UPDATE EVENT
-------------------------------- */

window.addEventListener(
    "load",
    function () {

        if (
            window.UniversalEngineAPI
        ) {

            window
                .UniversalEngineAPI
                .on(
                    "engine:update",
                    function () {

                        updateStatus();

                    }
                );

        }

    }
);

</script>

</body>

</html>

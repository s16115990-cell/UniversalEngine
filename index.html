<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b0f14">

    <title>UniversalEngine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #080b0f;
            --panel: #111820;
            --panel2: #18212b;
            --border: #263442;
            --text: #f5f7fa;
            --muted: #9aa8b5;
            --green: #00ff88;
            --green2: #00c96b;
            --red: #ff4d5a;
            --yellow: #ffc857;
            --blue: #4da3ff;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #122018 0%,
                    var(--bg) 45%
                );

            color: var(--text);
        }

        .app {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */

        .header {
            padding: 10px 0 20px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            font-size: 30px;
            font-weight: 800;

            color: var(--green);

            text-shadow:
                0 0 15px rgba(0, 255, 136, 0.35);
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 15px;
        }

        /* Cards */

        .card {
            margin-top: 16px;

            background:
                linear-gradient(
                    180deg,
                    rgba(24, 33, 43, 0.96),
                    rgba(17, 24, 32, 0.96)
                );

            border: 1px solid var(--border);
            border-radius: 16px;

            padding: 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .card-title {
            margin: 0 0 14px;

            font-size: 18px;
            font-weight: 700;
        }

        /* Status */

        .status {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 14px;

            border-radius: 12px;

            background: #0a0e12;
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 12px;
            height: 12px;

            border-radius: 50%;

            background: var(--yellow);

            box-shadow:
                0 0 12px rgba(255, 200, 87, 0.6);
        }

        .status-dot.ok {
            background: var(--green);

            box-shadow:
                0 0 12px rgba(0, 255, 136, 0.7);
        }

        .status-dot.error {
            background: var(--red);

            box-shadow:
                0 0 12px rgba(255, 77, 90, 0.7);
        }

        .status-text {
            font-weight: 700;
        }

        /* Buttons */

        .buttons {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }

        button {
            min-height: 52px;

            padding: 12px 14px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--panel2);
            color: var(--text);

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.15s ease,
                background 0.15s ease,
                border-color 0.15s ease;
        }

        button:hover {
            background: #202d39;
            border-color: #3b5063;
        }

        button:active {
            transform: scale(0.97);
        }

        button.primary {
            background: #073d29;
            border-color: #087d4d;
            color: var(--green);
        }

        button.danger {
            background: #3d1117;
            border-color: #7d202b;
            color: #ff8790;
        }

        button.blue {
            background: #0d2940;
            border-color: #1d5b88;
            color: #73bcff;
        }

        /* Information grid */

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 10px;
        }

        .info {
            padding: 14px;

            background: #0b1015;

            border:
                1px solid var(--border);

            border-radius: 12px;
        }

        .info-label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 800;
        }

        /* Output */

        #output {
            min-height: 180px;

            padding: 15px;

            overflow-x: auto;

            white-space: pre-wrap;
            word-break: break-word;

            background: #050709;

            border:
                1px solid var(--border);

            border-radius: 12px;

            color: #dce6ee;

            font-family:
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.55;
        }

        .success {
            color: var(--green);
        }

        .error {
            color: #ff7b84;
        }

        /* Footer */

        .footer {
            padding: 22px 0 10px;

            text-align: center;

            color: #667481;

            font-size: 12px;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .app {
                padding: 14px;
            }

            .logo {
                font-size: 26px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: 1fr 1fr;
            }

            .card {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- Header -->

    <header class="header">

        <div class="logo">
            ⚡ UniversalEngine
        </div>

        <div class="subtitle">
            Personal Universal App Development Engine
        </div>

    </header>


    <!-- Engine Status -->

    <section class="card">

        <h2 class="card-title">
            Engine Status
        </h2>

        <div class="status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span
                id="statusText"
                class="status-text"
            >
                Checking engine...
            </span>

        </div>

    </section>


    <!-- Controls -->

    <section class="card">

        <h2 class="card-title">
            Engine Controls
        </h2>

        <div class="buttons">

            <button
                class="blue"
                type="button"
                onclick="checkEngine()"
            >
                🔍 Check Engine
            </button>

            <button
                class="primary"
                type="button"
                onclick="startEngine()"
            >
                ▶ Start Engine
            </button>

            <button
                class="danger"
                type="button"
                onclick="stopEngine()"
            >
                ■ Stop Engine
            </button>

            <button
                type="button"
                onclick="addTestEntity()"
            >
                ＋ Add Entity
            </button>

        </div>

    </section>


    <!-- Engine Information -->

    <section class="card">

        <h2 class="card-title">
            Engine Information
        </h2>

        <div class="info-grid">

            <div class="info">

                <div class="info-label">
                    Engine
                </div>

                <div
                    id="engineName"
                    class="info-value"
                >
                    —
                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    Version
                </div>

                <div
                    id="engineVersion"
                    class="info-value"
                >
                    —
                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    Running
                </div>

                <div
                    id="engineRunning"
                    class="info-value"
                >
                    —
                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    Entities
                </div>

                <div
                    id="entityCount"
                    class="info-value"
                >
                    —
                </div>

            </div>

        </div>

    </section>


    <!-- Console -->

    <section class="card">

        <h2 class="card-title">
            Engine Console
        </h2>

        <div id="output">
            Initializing UniversalEngine...
        </div>

    </section>


    <footer class="footer">
        UniversalEngine Test Console
    </footer>

</div>


<!--
    UniversalEngine Core

    Version query parameters prevent old cached
    JavaScript files from being reused by the browser.
-->

<script src="./core/EngineConfig.js?v=20260814-2"></script>
<script src="./core/EventBus.js?v=20260814-2"></script>
<script src="./core/MasterEngine.js?v=20260814-2"></script>
<script src="./core/index.js?v=20260814-2"></script>


<script>

"use strict";


/* =========================================================
   UniversalEngine Test Console
   ========================================================= */

const output =
    document.getElementById("output");

const statusDot =
    document.getElementById("statusDot");

const statusText =
    document.getElementById("statusText");

const engineName =
    document.getElementById("engineName");

const engineVersion =
    document.getElementById("engineVersion");

const engineRunning =
    document.getElementById("engineRunning");

const entityCount =
    document.getElementById("entityCount");


/* =========================================================
   Utility
   ========================================================= */

function writeOutput(data, type = "normal") {

    if (typeof data === "string") {

        output.textContent = data;

    } else {

        try {

            output.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

        } catch (error) {

            output.textContent =
                String(data);

        }

    }

    output.className = "";

    if (type === "success") {
        output.classList.add("success");
    }

    if (type === "error") {
        output.classList.add("error");
    }
}


function setStatus(
    text,
    type = "loading"
) {

    statusText.textContent = text;

    statusDot.className =
        "status-dot";

    if (type === "ok") {

        statusDot.classList.add("ok");

    }

    if (type === "error") {

        statusDot.classList.add("error");

    }
}


/* =========================================================
   Engine API Detection
   ========================================================= */

function getEngineAPI() {

    if (
        window.UniversalEngineAPI &&
        typeof window.UniversalEngineAPI === "object"
    ) {

        return window.UniversalEngineAPI;

    }

    return null;
}


function getEngineObject() {

    if (
        window.UniversalEngine &&
        typeof window.UniversalEngine === "object"
    ) {

        return window.UniversalEngine;

    }

    return null;
}


/* =========================================================
   Safe Status
   ========================================================= */

function readEngineStatus() {

    const api =
        getEngineAPI();

    const engine =
        getEngineObject();


    /*
       Prefer the public API.
    */

    if (
        api &&
        typeof api.getStatus === "function"
    ) {

        return api.getStatus();

    }


    /*
       Fallback:
       Some versions may expose getStatus()
       directly on UniversalEngine.
    */

    if (
        engine &&
        typeof engine.getStatus === "function"
    ) {

        return engine.getStatus();

    }


    /*
       Final fallback:
       Build a status object from available
       public properties.
    */

    if (engine) {

        return {

            name:
                engine.name ||
                "UniversalEngine",

            version:
                engine.version ||
                "unknown",

            running:
                Boolean(engine.running),

            entities:
                Array.isArray(engine.entities)
                    ? engine.entities.length
                    : 0,

            tasks:
                Array.isArray(engine.tasks)
                    ? engine.tasks.length
                    : 0,

            projects:
                Array.isArray(engine.projects)
                    ? engine.projects.length
                    : 0

        };

    }


    throw new Error(
        "UniversalEngine is not available."
    );
}


/* =========================================================
   Update Information UI
   ========================================================= */

function updateInformation(status) {

    if (!status) {
        return;
    }


    engineName.textContent =
        status.name ||
        status.engine ||
        "UniversalEngine";


    engineVersion.textContent =
        status.version ||
        "—";


    engineRunning.textContent =
        status.running === true
            ? "YES"
            : "NO";


    if (
        typeof status.entities === "number"
    ) {

        entityCount.textContent =
            String(status.entities);

    } else {

        entityCount.textContent =
            "—";

    }
}


/* =========================================================
   Check Engine
   ========================================================= */

function checkEngine() {

    try {

        const engine =
            getEngineObject();

        const api =
            getEngineAPI();


        if (!engine) {

            setStatus(
                "UniversalEngine not loaded",
                "error"
            );

            writeOutput(
                "❌ UniversalEngine NOT loaded.\n\n" +
                "Check the core JavaScript files.",
                "error"
            );

            return;

        }


        if (!api) {

            setStatus(
                "Engine loaded, API missing",
                "error"
            );

            writeOutput(
                "⚠️ UniversalEngine loaded,\n" +
                "but UniversalEngineAPI is missing.",
                "error"
            );

            return;

        }


        const status =
            readEngineStatus();


        updateInformation(status);


        setStatus(
            "UniversalEngine loaded successfully",
            "ok"
        );


        writeOutput(
            {
                status:
                    "ENGINE LOADED",

                engine:
                    status,

                api:
                    "UniversalEngineAPI available",

                timestamp:
                    new Date().toISOString()
            },
            "success"
        );

    }

    catch (error) {

        setStatus(
            "Engine error",
            "error"
        );

        writeOutput(
            "❌ ENGINE ERROR\n\n" +
            error.name +
            ": " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   Start Engine
   ========================================================= */

function startEngine() {

    try {

        const api =
            getEngineAPI();


        if (!api) {

            throw new Error(
                "UniversalEngineAPI is not available."
            );

        }


        if (
            typeof api.start !== "function"
        ) {

            throw new Error(
                "UniversalEngineAPI.start() is not available."
            );

        }


        const result =
            api.start();


        const status =
            readEngineStatus();


        updateInformation(status);


        setStatus(
            "Engine started",
            "ok"
        );


        writeOutput(
            {
                action:
                    "START",

                result:
                    result,

                status:
                    status
            },
            "success"
        );

    }

    catch (error) {

        setStatus(
            "Start failed",
            "error"
        );

        writeOutput(
            "❌ START ERROR\n\n" +
            error.name +
            ": " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   Stop Engine
   ========================================================= */

function stopEngine() {

    try {

        const api =
            getEngineAPI();


        if (!api) {

            throw new Error(
                "UniversalEngineAPI is not available."
            );

        }


        if (
            typeof api.stop !== "function"
        ) {

            throw new Error(
                "UniversalEngineAPI.stop() is not available."
            );

        }


        const result =
            api.stop();


        const status =
            readEngineStatus();


        updateInformation(status);


        setStatus(
            "Engine stopped",
            "ok"
        );


        writeOutput(
            {
                action:
                    "STOP",

                result:
                    result,

                status:
                    status
            },
            "success"
        );

    }

    catch (error) {

        setStatus(
            "Stop failed",
            "error"
        );

        writeOutput(
            "❌ STOP ERROR\n\n" +
            error.name +
            ": " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   Add Test Entity
   ========================================================= */

function addTestEntity() {

    try {

        const api =
            getEngineAPI();


        if (!api) {

            throw new Error(
                "UniversalEngineAPI is not available."
            );

        }


        if (
            typeof api.addEntity !== "function"
        ) {

            throw new Error(
                "UniversalEngineAPI.addEntity() is not available."
            );

        }


        const entity = {

            name:
                "TestEntity",

            enabled:
                true,

            update:
                function(deltaTime) {

                    /*
                       Test entity update.
                       Future game/app logic can
                       be placed here.
                    */

                }

        };


        const result =
            api.addEntity(entity);


        const status =
            readEngineStatus();


        updateInformation(status);


        setStatus(
            "Entity added successfully",
            "ok"
        );


        writeOutput(
            {
                action:
                    "ADD ENTITY",

                entity:
                    entity.name,

                result:
                    result,

                status:
                    status
            },
            "success"
        );

    }

    catch (error) {

        setStatus(
            "Entity operation failed",
            "error"
        );

        writeOutput(
            "❌ ENTITY ERROR\n\n" +
            error.name +
            ": " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   Automatic Engine Check
   ========================================================= */

window.addEventListener(
    "load",
    function() {

        /*
           Small delay allows all external
           JavaScript files to finish loading.
        */

        setTimeout(
            checkEngine,
            100
        );

    }
);

</script>

</body>
</html>
